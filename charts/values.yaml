
app:
  name: vision-matcher

statefulset:
  name: vision-matcher
  serviceName: vision-matcher
  replicas: 1
  containerName: vision-matcher
  pullPolicy: Always
  storage: 1Gi
  resources:
    requests:
      cpu: 300m
      memory: 896Mi
    limits:
      cpu: "1"
      memory: 1536Mi

service:
  name: vision-matcher-service
  ports:
    redis: 5123
